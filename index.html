document.getElementById("question").innerHTML=
"No questions found / कोई प्रश्न नहीं";
document.getElementById("options").innerHTML="";
return;
}

document.getElementById("progress").innerText=
"Question "+(current+1)+" / "+filtered.length;

document.getElementById("question").innerHTML=
"<b>"+(current+1)+". "+q.hi+"</b><small>"+q.en+"</small>";

let optionBox=document.getElementById("options");
optionBox.innerHTML="";

q.opts.forEach((option,index)=>{

let btn=document.createElement("button");
btn.className="option";
btn.innerText=String.fromCharCode(65+index)+". "+option;

if(answers[q.id]!==undefined){

btn.disabled=true;

if(index===q.answer){
btn.classList.add("correct");
}

if(index===answers[q.id] && index!==q.answer){
btn.classList.add("wrong");
}

}

btn.onclick=()=>selectAnswer(index);

optionBox.appendChild(btn);

});

let feedback=document.getElementById("feedback");

if(answers[q.id]!==undefined){

feedback.style.display="block";

if(answers[q.id]===q.answer){

feedback.style.background="#d9f8e4";
feedback.innerHTML=
"✅ Correct Answer / सही उत्तर"+
"<br><b>Explanation / व्याख्या:</b><br>"+
q.expHi+"<br>"+q.expEn;

}else{

feedback.style.background="#ffe0e0";
feedback.innerHTML=
"❌ Incorrect Answer / गलत उत्तर"+
"<br><b>Correct Answer / सही उत्तर:</b> "+
q.opts[q.answer]+
"<br><b>Explanation / व्याख्या:</b><br>"+
q.expHi+"<br>"+q.expEn;

}

}else{

feedback.style.display="none";

}

document.getElementById("prevBtn").disabled=current===0;
document.getElementById("nextBtn").disabled=current===filtered.length-1;

}

function selectAnswer(index){

if(finished)return;

let q=filtered[current];

if(answers[q.id]!==undefined)return;

answers[q.id]=index;
render();

}

function next(){

if(current<filtered.length-1){
current++;
render();
}

}

function previous(){

if(current>0){
current--;
render();
}

}

function changeFilter(){

if(finished)return;

let subject=document.getElementById("subject").value;
let group=document.getElementById("group").value;

filtered=questions.filter(q=>
(subject==="All"||q.subject===subject)&&
(group==="All"||q.group===group)
);

current=0;
render();

}

function submitTest(){

if(finished)return;

finished=true;
clearInterval(timerInterval);

let correct=0;
let wrong=0;
let unattempted=0;

filtered.forEach(q=>{

if(answers[q.id]===undefined){
unattempted++;
}else if(answers[q.id]===q.answer){
correct++;
}else{
wrong++;
}

});

document.getElementById("result").innerHTML=
"<h2>Test Result / परीक्षा परिणाम</h2>"+
"<p>✅ Correct / सही: "+correct+"</p>"+
"<p>❌ Wrong / गलत: "+wrong+"</p>"+
"<p>⭕ Unattempted / छोड़े गए: "+unattempted+"</p>"+
"<h2>Score / अंक: "+correct+" / "+filtered.length+"</h2>";

document.querySelectorAll(".option").forEach(btn=>{
btn.disabled=true;
});

document.getElementById("prevBtn").disabled=true;
document.getElementById("nextBtn").disabled=true;

}

function startTimer(){

timerInterval=setInterval(()=>{

if(finished)return;

seconds--;

let minutes=Math.floor(seconds/60);
let remaining=seconds%60;

document.getElementById("timer").innerText=
String(minutes).padStart(2,"0")+":"+
String(remaining).padStart(2,"0");

if(seconds<=0){
submitTest();
}

},1000);

}

render();
startTimer();

</script>
</body>
</html>
